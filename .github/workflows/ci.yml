name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

jobs:
  check:
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        go: [ '1.26.2' ]
    name: Check ${{ matrix.os }} @ Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go Modules and Build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The programs the Lighthouse checks run: formatters and linters, each in
      # the bubblewrap sandbox. Versions match the ones the checks are made with.
      - name: Install Lighthouse Tools
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g prettier@3.9.10 markdownlint-cli2@0.24.0
          pipx install ruff==0.17.3
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: Install Lighthouse
        uses: siyul-park/lighthouse@v0.0.0-707a2cd944e4
        with:
          version: 0.0.0-707a2cd944e4

      - name: Initialize Project
        run: make init

      - name: Run Checks
        run: make check
        env:
          # CI trusts the project to run the programs it names.
          LIGHTHOUSE_TRUST: "1"

  coverage:
    needs: check
    # Coverage runs on ARM64 so architecture-specific executable-memory and
    # encoder paths are reachable. The native rebuild is tracked separately.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Initialize Project
        run: make init

      - name: Generate and Check Coverage
        run: make coverage-check

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          fail_ci_if_error: false

  benchmark:
    needs: check
    name: Benchmark Report
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum

      - name: Run Benchmark
        run: make benchmark benchmark-level=quick
