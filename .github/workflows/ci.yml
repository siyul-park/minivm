name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Cache Go Modules and Build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # OS-level setup that needs sudo. Tool versions live in the Makefile and
      # .lighthouse-version; make init installs them.
      - name: Set up Sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Initialize Project
        run: make init

      - name: Run Checks
        run: make check
        env:
          # CI trusts the project to run the programs it names.
          LIGHTHOUSE_TRUST: "1"

  coverage:
    needs: check
    # Coverage runs on ARM64 so architecture-specific executable-memory and
    # encoder paths are reachable. The native rebuild is tracked separately.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Initialize Project
        run: make init

      - name: Generate and Check Coverage
        run: make coverage-check

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          fail_ci_if_error: false

  benchmark:
    needs: check
    if: github.ref != 'refs/heads/main'
    name: Benchmark Report
    # ARM64, because the JIT runs nowhere else. A slower result never fails the
    # build: a shared runner is too noisy to gate on.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum

      - name: Compare with Main
        run: |
          base="$(git merge-base origin/main HEAD)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing to compare: HEAD is on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          make benchmark-diff base="$base" benchmark-level=quick > report.txt
          cat report.txt
          {
            echo "## Benchmark against \`${base:0:7}\`"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
