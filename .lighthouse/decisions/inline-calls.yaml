# yaml-language-server: $schema=https://raw.githubusercontent.com/siyul-park/lighthouse/main/schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: local/inline-calls
  uid: c9164186-3057-426d-82a0-5764d34703c0
spec:
  title: A function marked to inline inlines at its calls
  context: >-
    The runtime's hot handlers call small container methods whose cost is only
    acceptable when the compiler inlines them. A change that pushes such a
    method past the inliner's budget compiles and passes every test, and shows
    up only as a benchmark regression. The marker states the intent at the
    function, and gcassert checks it against the compiler's decisions.
  scope:
    subject: project
  requirement: >-
    A function whose doc comment ends with `//gcassert:inline` MUST be inlined
    at every call site in the main module.
  consequences: >-
    gcassert compiles the whole module, never one file, and prints every call
    site that was not inlined on stderr, so a failing run is one finding on the
    project whose message lists the sites. A marked function with no call site
    is not checked.
  severity: error
  languages:
    go: {}
  check:
    type: command
    command: [gcassert, "./..."]
    output: status
  provenance:
    wasDerivedFrom: ["gcassert: https://github.com/jordanlewis/gcassert"]
  examples:
    - name: marked function inlines
      language: go
      kind: valid
      files:
        - path: go.mod
          body: |
            module example

            go 1.22
        - path: main.go
          body: |
            package main

            // Add returns a+b.
            //
            //gcassert:inline
            func Add(a, b int) int { return a + b }

            func main() { _ = Add(1, 2) }
    - name: marked function does not inline
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: |
            module example

            go 1.22
        - path: main.go
          body: "package main\n\n// Sum returns the sum of xs.\n//\n//gcassert:inline\n//go:noinline\nfunc Sum(xs []int) int {\n\tn := 0\n\tfor _, x := range xs {\n\t\tn += x\n\t}\n\treturn n\n}\n\nfunc main() { _ = Sum([]int{1, 2}) }\n"
      expect:
        - line: 1
